name: tally
description: Split expenses simply. A free, cross-platform alternative to Splitwise.
publish_to: none

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.0.0

  # Navigation
  go_router: ^14.0.0

  # State management (non-codegen for Push 1; Push 2 adds riverpod_annotation + build_runner)
  flutter_riverpod: ^2.0.0

  # Money — never use double for currency amounts
  decimal: ^2.3.3

  # Date/number formatting
  intl: ^0.19.0

  # Group photo picking (web + Android)
  image_picker: ^1.1.2

  # Bank statement import — RFC-4180 CSV parsing (quoted fields, CRLF)
  csv: ^6.0.0

  # Statement file picking. Always read with withData: true and use .bytes —
  # on web a picked file has no path, and the app has no dart:io anywhere.
  file_picker: ^8.0.0

  # SHA-256 for the opaque transaction fingerprint. Promoted from a transitive
  # dep of supabase_flutter so it can be imported directly.
  crypto: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
